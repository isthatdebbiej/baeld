[build-system]
requires=["hatchling>=1.27"]
build-backend="hatchling.build"

[project]
name="baeld-agent"
version="0.1.0.dev1"
description="Python phase and Browser Use adapter for the Baeld runtime"
readme="README.md"
requires-python=">=3.12"
license="MIT OR Apache-2.0"
authors=[{name="Baeld contributors"}]
classifiers=["Development Status :: 3 - Alpha","Programming Language :: Python :: 3.12","Operating System :: POSIX :: Linux"]

[project.optional-dependencies]
browser-use=["browser-use==0.13.6"]

[project.urls]
Repository="https://github.com/isthatdebbiej/baeld"

[tool.hatch.build.targets.wheel]
packages=["src/baeld_agent"]
