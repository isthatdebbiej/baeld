name = "ubuntu24-focused-pilot"
chromium = ".baeld/chromium"
node = "node"
server_script = "workloads/server.mjs"
driver_script = "workloads/driver/driver.mjs"
server_port = 4173
settle_ms = 3000
workloads = ["agent-dashboard", "websocket"]
waits_ms = [5000, 10000]
concurrency = [1, 5]
repetitions = 5
browser_cpus = "2-7"

[[mechanisms]]
kind = "baseline"

[[mechanisms]]
kind = "chrome-lifecycle-freeze"

[[mechanisms]]
kind = "cpu-quota"
quota_us = 25000
period_us = 100000

[[mechanisms]]
kind = "cgroup-freeze"
delay_ms = 500
