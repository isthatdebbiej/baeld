name = "smoke"
chromium = ".baeld/chromium"
node = "node"
server_script = "workloads/server.mjs"
driver_script = "workloads/driver/driver.mjs"
server_port = 4173
settle_ms = 1000
workloads = ["static", "normal-spa", "websocket"]
waits_ms = [2000]
concurrency = [1]
repetitions = 1

[[mechanisms]]
kind = "baseline"

[[mechanisms]]
kind = "chrome-lifecycle-freeze"

[[mechanisms]]
kind = "cpu-quota"
quota_us = 25000
period_us = 100000

[[mechanisms]]
kind = "cgroup-freeze"
delay_ms = 500
