name = "stagehand-preflight"
chromium = ".baeld/chromium"
node = "bun"
server_script = "workloads/server.mjs"
driver_script = "workloads/driver/stagehand.mjs"
server_port = 4173
settle_ms = 1000
workloads = ["agent-dashboard"]
waits_ms = [500]
concurrency = [1]
repetitions = 1
browser_cpus = "2-7"
allow_extensions = true
chrome_args = [
  "--remote-allow-origins=*",
  "--enable-unsafe-extension-debugging",
  "--enable-features=WebMCPTesting,DevToolsWebMCPSupport",
]

[[mechanisms]]
kind = "baseline"
