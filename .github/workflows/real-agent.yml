name: Real-agent compatibility

on:
  workflow_dispatch:
    inputs:
      model:
        description: Pinned OpenAI-compatible model id without provider prefix
        required: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: [self-hosted, linux, x64, baeld-cgroup-v2]
    timeout-minutes: 90
    environment: real-agent-gate
    env:
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BAELD_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: bun install --frozen-lockfile
      - run: python -m pip install uv==0.7.9
      - run: uv pip install --system --require-hashes -r requirements-browser-use.txt
      - run: scripts/setup-ubuntu.sh
      - run: cargo build --release --locked
      - run: bash scripts/run-real-agent-gates.sh
      - if: always()
        run: target/release/baeld cleanup
