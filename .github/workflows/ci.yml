name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=high

  analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analysis/requirements.txt
      - run: python -m py_compile analysis/analyze.py
      - run: python -m py_compile analysis/paired.py
      - run: python -m unittest analysis.test_paired
      - run: python analysis/analyze.py analysis/fixtures --output /tmp/baeld-analysis
      - run: python analysis/paired.py analysis/fixtures --output /tmp/baeld-paired.json

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: bash -n scripts/package-release.sh
      - run: scripts/package-release.sh v0.1.0-ci
      - run: test -s dist/baeld-v0.1.0-ci-linux-x86_64.tar.gz
      - run: sha256sum --check dist/baeld-v0.1.0-ci-linux-x86_64.tar.gz.sha256
