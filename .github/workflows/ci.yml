name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun run check
      - run: bun audit --audit-level=high
      - run: bash -n scripts/setup-ubuntu.sh

  analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analysis/requirements.txt
      - run: python -m py_compile analysis/analyze.py
      - run: python -m py_compile analysis/paired.py
      - run: python -m unittest analysis.test_paired
      - run: python analysis/analyze.py analysis/fixtures --output /tmp/baeld-analysis
      - run: python analysis/paired.py analysis/fixtures --output /tmp/baeld-paired.json

  browser-use:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.7.9
      - run: uv pip install --system --require-hashes -r requirements-browser-use.txt
      - run: python -m py_compile workloads/driver/browser_use_driver.py
      - run: python -m unittest analysis.test_browser_use_driver

  adapters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.18.0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: python -m pip install build
      - run: python -m build packages/python
      - run: PYTHONPATH=packages/python/src python -m unittest discover packages/python/tests -v
      - run: npm pack --dry-run --workspace @baeld/agent

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.100.0
      - run: bash -n scripts/package-release.sh
      - run: scripts/package-release.sh v0.1.0-ci
      - run: test -s dist/baeld-v0.1.0-ci-linux-x86_64.tar.gz
      - run: sha256sum --check dist/baeld-v0.1.0-ci-linux-x86_64.tar.gz.sha256
