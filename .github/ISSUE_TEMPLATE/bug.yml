name: Bug report
description: Report reproducible Baeld runtime behavior
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: { label: What happened? }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include policy mode, phases, and the smallest authorized workload. }
    validations: { required: true }
  - type: textarea
    id: environment
    attributes: { label: Environment, description: Include Baeld, kernel, Chromium, framework, and cgroup versions. }
    validations: { required: true }
  - type: textarea
    id: artifacts
    attributes: { label: Sanitized artifacts, description: Never attach credentials, cookies, prompts, or personal data. }
